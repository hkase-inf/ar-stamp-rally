<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>情報の偉人 ARスタンプラリー</title>
<link rel="stylesheet" href="style.css">
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>

<div id="screen-start" class="screen active">
  <div class="start-card">
    <p class="eyebrow">Open Campus AR Rally</p>
    <h1>情報の偉人<br>ARスタンプラリー</h1>
    <p class="lead">廊下のポスターにスマホをかざして、<br>9人の偉人スタンプを集めよう。</p>
    <button id="btn-open-camera" class="btn-primary">はじめる（カメラ起動）</button>
    <p class="hint">今回のプロトタイプは Grace Hopper のポスターのみ体験できます</p>
  </div>
</div>

<div id="screen-camera" class="screen">
  <a-scene
    id="ar-scene"
    mindar-image="imageTargetSrc: ./assets/grace-hopper.mind; autoStart: false; uiScanning: no; uiLoading: no; uiError: no;"
    embedded
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity id="gh-target" mindar-image-target="targetIndex: 0"></a-entity>
  </a-scene>

  <div id="camera-fallback" class="camera-fallback hidden">
    <p>カメラを起動できませんでした。<br>カメラの利用を許可してもう一度お試しください。</p>
  </div>

  <div class="viewfinder">
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>
  </div>

  <div class="camera-hud">
    <p class="hud-text" id="hud-text">Grace Hopper のポスターに<br>スマホをかざしてね</p>
    <button id="btn-scan" class="btn-primary btn-scan hidden">📷 スタンプをGET！</button>
    <button id="btn-back-start" class="btn-text">はじめの画面に戻る</button>
  </div>
</div>

<div id="screen-stamp" class="screen">
  <div class="stamp-overlay">
    <div class="passport-card" id="passport-card">
      <p class="passport-title">偉人スタンプカード</p>
      <div class="passport-grid" id="passport-grid"></div>
      <p class="passport-count"><span id="stamp-count">0</span> / 9 個 集めた</p>
      <button id="btn-continue" class="btn-primary">カメラに戻る</button>
    </div>

    <div class="stamp-fx" id="stamp-fx">
      <div class="ink-ring"></div>
      <img src="assets/grace-hopper-stamp.png" alt="" class="stamp-image">
      <p class="get-label">GET!</p>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
