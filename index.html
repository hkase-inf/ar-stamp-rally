<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>情報の偉人 ARスタンプラリー</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<div id="screen-start" class="screen active">
  <div class="start-card">
    <p class="eyebrow">Open Campus AR Rally</p>
    <h1>情報の偉人<br>ARスタンプラリー</h1>
    <p class="lead">廊下のポスターにスマホをかざして、<br>9人の偉人スタンプを集めよう。</p>
    <button id="btn-open-camera" class="btn-primary">はじめる（カメラ起動）</button>
    <p class="hint">9人全員のポスターに対応しています</p>
    <button id="btn-debug-fill" class="btn-debug">🔧 テスト：9個まとめて集めてボーナスへ</button>
  </div>
</div>

<div id="screen-camera" class="screen">
  <video id="camera-feed" autoplay playsinline muted></video>
  <canvas id="qr-canvas" class="hidden"></canvas>

  <div id="camera-fallback" class="camera-fallback hidden">
    <p>カメラを起動できませんでした。<br>カメラの利用を許可してもう一度お試しください。</p>
  </div>

  <div class="viewfinder">
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>
  </div>

  <div class="camera-hud">
    <p class="hud-text" id="hud-text">ポスターのQRコードを<br>枠の中に収めてね</p>
    <button id="btn-scan" class="btn-primary btn-scan hidden">📷 スタンプをGET！</button>
    <button id="btn-back-start" class="btn-text">はじめの画面に戻る</button>
  </div>
</div>

<div id="screen-stamp" class="screen">
  <div class="stamp-overlay">
    <div class="passport-card" id="passport-card">
      <p class="passport-title">偉人スタンプカード</p>
      <div class="passport-grid" id="passport-grid"></div>

      <div class="figure-bio hidden" id="figure-bio">
        <p class="figure-bio-name" id="figure-bio-name"></p>
        <p class="figure-bio-text" id="figure-bio-text"></p>
        <a class="figure-bio-link" id="figure-bio-link" target="_blank" rel="noopener">くわしく見る →</a>
      </div>

      <p class="passport-count"><span id="stamp-count">0</span> / 9 個 集めた</p>

      <button id="btn-bonus-enter" class="btn-primary btn-bonus hidden">🎉 ボーナスステージへ</button>
      <p id="bonus-enter-hint" class="bonus-enter-hint hidden">🤳 しずっぴーと一緒に写真を撮ろう！</p>
      <button id="btn-continue" class="btn-primary">カメラに戻る</button>
    </div>

    <div class="stamp-fx" id="stamp-fx">
      <div class="ink-ring"></div>
      <img src="assets/grace-hopper-stamp.png" alt="" class="stamp-image">
      <p class="get-label">GET!</p>
    </div>
  </div>
</div>

<div id="screen-bonus" class="screen">
  <video id="bonus-camera-feed" autoplay playsinline muted></video>
  <canvas id="bonus-three-canvas"></canvas>
  <canvas id="bonus-capture-canvas" class="hidden"></canvas>

  <div id="bonus-loading" class="bonus-loading hidden">
    <div class="spinner"></div>
    <p>しずっぴーを呼んでいます…</p>
  </div>

  <div id="bonus-camera-fallback" class="camera-fallback hidden">
    <p>カメラを起動できませんでした。<br>カメラの利用を許可してもう一度お試しください。</p>
  </div>

  <div class="bonus-motions">
    <label class="motion-toggle" title="モーションのオン/オフ">
      <input type="checkbox" id="motion-toggle-input">
      <span class="motion-toggle-track"><span class="motion-toggle-thumb"></span></span>
    </label>
    <button class="btn-motion" data-motion="Wave">👋 手を振る</button>
    <button class="btn-motion" data-motion="Jump">🤸 ジャンプ</button>
    <button class="btn-motion" data-motion="Walk">🚶 歩く</button>
  </div>

  <div class="bonus-hud">
    <button id="btn-bonus-flip" class="btn-icon" title="インカメラ／アウトカメラ切り替え">🔄</button>
    <button id="btn-bonus-capture" class="btn-primary btn-scan hidden">📸 撮影する</button>
    <button id="btn-bonus-back" class="btn-text">スタンプカードに戻る</button>
  </div>

  <div id="bonus-result" class="bonus-result hidden">
    <img id="bonus-result-img" alt="しずっぴーと撮った写真">
    <div class="bonus-result-actions">
      <button id="btn-bonus-save" class="btn-primary">保存する</button>
      <button id="btn-bonus-retake" class="btn-text">撮り直す</button>
    </div>
  </div>
</div>

<script src="script.js?v=5"></script>
</body>
</html>
